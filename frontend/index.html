<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Зміна.ua — погодинні зміни для бізнесу та виконавців</title>
    <meta
      name="description"
      content="Зміна.ua — платформа погодинної роботи: бізнес публікує зміни, виконавці відгукуються, виходять на зміну та отримують оплату."
    />
    <meta name="author" content="Зміна.ua" />
    <link rel="canonical" href="https://zmina.ua/" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Theme color follows the app's light/dark colour scheme -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171a21" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Зміна.ua" />
    <meta property="og:locale" content="uk_UA" />
    <meta property="og:title" content="Зміна.ua — погодинні зміни для бізнесу та виконавців" />
    <meta
      property="og:description"
      content="Платформа погодинної роботи: бізнес публікує зміни, виконавці відгукуються та отримують оплату."
    />
    <meta property="og:url" content="https://zmina.ua/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Зміна.ua — погодинні зміни для бізнесу та виконавців" />
    <meta
      name="twitter:description"
      content="Платформа погодинної роботи: бізнес публікує зміни, виконавці відгукуються та отримують оплату."
    />

    <!-- Шрифти self-hosted через @fontsource-variable, імпортуються в src/theme/theme.css -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 1rem; font-family: system-ui, sans-serif; text-align: center">
        Для роботи Зміна.ua потрібно увімкнути JavaScript у браузері.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
