services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - basenet

  valkey:
    image: valkey/valkey:alpine
    container_name: valkey
    restart: always
    networks:
      - basenet

  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: postgres
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - basenet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pg_backup:
    image: prodrigestivill/postgres-backup-local:17-alpine
    container_name: postgres_backup
    restart: always
    env_file: .env
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
    networks:
      - basenet      

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
    container_name: backend
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_USERNAME=${POSTGRES_USER}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_NAME=${POSTGRES_DB}
      - DATABASE_HOST=${DB_HOST}
      - DATABASE_PORT=${DB_PORT}
      # Caddy передає IP відвідувача через X-Forwarded-For.
      - TRUST_PROXY=true
    volumes:
      - ./backend/public:/app/public
    depends_on:
      - postgres
      - valkey
    healthcheck:
      test:
        ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - basenet

  lifecycle-worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
    container_name: lifecycle-worker
    restart: always
    command: ["node", "workers/shiftLifecycleWorker.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_USERNAME=${POSTGRES_USER}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_NAME=${POSTGRES_DB}
      - DATABASE_HOST=${DB_HOST}
      - DATABASE_PORT=${DB_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - basenet

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.prod
      target: production
      args:
        - VITE_API_URL=https://${FRONTEND_DOMAIN}/api
    container_name: frontend
    restart: always
    environment:
      - VITE_API_URL=https://${FRONTEND_DOMAIN}/api
    depends_on:
      - backend
    networks:
      - basenet

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  basenet:
    driver: bridge
