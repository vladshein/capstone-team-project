services:
  stage-valkey:
    image: valkey/valkey:alpine
    container_name: stage-valkey
    restart: always
    networks:
      - stagenet
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  stage-postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: stage-postgres
    restart: always
    env_file: .env
    volumes:
      - stage-pgdata:/var/lib/postgresql/data
    networks:
      - stagenet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  stage-pg_backup:
    image: prodrigestivill/postgres-backup-local:17-alpine
    container_name: stage-postgres_backup
    restart: always
    env_file: .env
    volumes:
      - ./stage-backups:/stage-backups
    depends_on:
      stage-postgres:
        condition: service_healthy
    networks:
      - stagenet      

  stage-migration:
    image: ghcr.io/${GITHUB_REPOSITORY}-backend:${IMAGE_TAG:-latest}
    container_name: stage-migration
    command: ["npm", "run", "db:m"]
    env_file:
      - .env
    depends_on:
      stage-postgres:
        condition: service_healthy
    networks:
      - stagenet

  stage-backend:
    image: ghcr.io/${GITHUB_REPOSITORY}-backend:${IMAGE_TAG:-latest}
    container_name: stage-backend
    restart: always
    env_file:
      - .env
    depends_on:
      stage-postgres:
        condition: service_healthy
      stage-valkey:
        condition: service_healthy
      stage-migration:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - stagenet
      - capstone_basenet

  stage-lifecycle-worker:
    image: ghcr.io/${GITHUB_REPOSITORY}-backend:${IMAGE_TAG:-latest}
    container_name: stage-lifecycle-worker
    restart: always
    command: ["node", "workers/shiftLifecycleWorker.js"]
    env_file:
      - .env
    depends_on:
      stage-postgres:
        condition: service_healthy
      stage-valkey:
        condition: service_healthy
      stage-migration:
        condition: service_completed_successfully
    networks:
      - stagenet

  stage-frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}-frontend:${IMAGE_TAG:-latest}
    container_name: stage-frontend
    restart: always
    env_file:
      - .env
    depends_on:
      - stage-backend
    networks:
      - stagenet
      - capstone_basenet

volumes:
  stage-pgdata:

networks:
  stagenet:
    driver: bridge
  capstone_basenet:
    external: true
