services:
  stage-valkey:
    image: valkey/valkey:alpine
    container_name: stage-valkey
    restart: always
    networks:
      - stagenet
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  stage-postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: stage-postgres
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - stagenet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  stage-pg_backup:
    image: prodrigestivill/postgres-backup-local:17-alpine
    container_name: stage-postgres_backup
    restart: always
    env_file: .env
    volumes:
      - ./backups:/backups
    depends_on:
      stage-postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
    networks:
      - stagenet      

  stage-backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
    container_name: stage-backend
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_USERNAME=${POSTGRES_USER}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_NAME=${POSTGRES_DB}
      - DATABASE_HOST=${DB_HOST}
      - DATABASE_PORT=${DB_PORT}
      # Caddy передає IP відвідувача через X-Forwarded-For.
      - TRUST_PROXY=true
    volumes:
      - ./backend/public:/app/public
    depends_on:
      - stage-postgres
      - stage-valkey
    healthcheck:
      test:
        ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - stagenet

  stage-lifecycle-worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
    container_name: lifecycle-worker
    restart: always
    command: ["node", "workers/shiftLifecycleWorker.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_USERNAME=${POSTGRES_USER}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_NAME=${POSTGRES_DB}
      - DATABASE_HOST=${DB_HOST}
      - DATABASE_PORT=${DB_PORT}
    depends_on:
      stage-postgres:
        condition: service_healthy
      stage-valkey:
        condition: service_healthy
    networks:
      - stagenet

  stage-frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.prod
      target: production
      args:
        - VITE_API_URL=https://${FRONTEND_DOMAIN}/api
    container_name: stage-frontend
    restart: always
    environment:
      - VITE_API_URL=https://${FRONTEND_DOMAIN}/api
    depends_on:
      - stage-backend
    networks:
      - stagenet

volumes:
  pgdata:
  
networks:
  stagenet:
    driver: bridge
