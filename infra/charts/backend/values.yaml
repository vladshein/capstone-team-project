replicaCount: 2

image:
  repository: <aws_account_id>.dkr.ecr.us-east-1.amazonaws.com/backend
  tag: "latest"

env:
  PORT: "5000"
  # Звернення до бази PostgreSQL через K8s Service Name
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "capstone_db"
  
  # Звернення до Valkey через K8s Service Name
  VALKEY_HOST: "valkey"
  VALKEY_PORT: "6379"

service:
  type: ClusterIP
  port: 5000