services:
  
  # PostgreSQL (GIS)
  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_ROOT_USER}
      - POSTGRES_PASSWORD=${DB_ROOT_PASSWORD}
      - POSTGRES_DB=${DB_ROOT_NAME}  
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - basenet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Valkey (Redis)
  valkey:
    image: valkey/valkey:alpine
    container_name: valkey
    restart: always
    ports:
      - "6379:6379"
    networks:
      - basenet
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Express
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env  
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - basenet

  lifecycle-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifecycle-worker
    restart: always
    command: node workers/shiftLifecycleWorker.js
    env_file:
      - ./backend/.env
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - basenet

  # React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    command: >
      sh -c "pnpm install --no-frozen-lockfile --config.confirmModulesPurge=false
      && pnpm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env  
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - basenet
    develop:
      watch:
        - path: ./frontend
          action: rebuild
          ignore:
            - node_modules/
            - .pnpm-store/
            - dist/

volumes:
  pgdata:
  frontend_node_modules:

networks:
  basenet:
    driver: bridge
