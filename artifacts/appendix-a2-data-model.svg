<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1650" viewBox="0 0 1200 1650" role="img" aria-labelledby="title description">
  <title id="title">Інформаційна модель платформи Зміна</title>
  <desc id="description">Вертикальна ER-схема основних сутностей платформи: користувача, профілю виконавця, компанії, локації, категорії, посади, зміни, заявки та відгуку.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#182235" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 31px Arial, sans-serif; fill: #182235; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #64748B; }
      .entity-title { font: 700 21px Arial, sans-serif; fill: #182235; }
      .field { font: 400 16px Arial, sans-serif; fill: #475569; }
      .field-key { font: 600 16px Arial, sans-serif; fill: #0F766E; }
      .rel { font: 600 15px Arial, sans-serif; fill: #64748B; }
      .cardinality { font: 700 16px Arial, sans-serif; fill: #13B981; }
      .note { font: 400 15px Arial, sans-serif; fill: #64748B; }
      .entity { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; }
      .entity-accent { fill: #ECFDF5; stroke: #13B981; stroke-width: 2; }
      .entity-head { fill: #F8FAFC; }
      .entity-head-accent { fill: #DDF8EF; }
      .line { fill: none; stroke: #64748B; stroke-width: 2.5; }
      .line-accent { fill: none; stroke: #13B981; stroke-width: 2.5; }
      .line-secondary { fill: none; stroke: #94A3B8; stroke-width: 2.25; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1200" height="1650" fill="#FFFFFF"/>
  <text x="600" y="58" text-anchor="middle" class="title">Інформаційна модель платформи «Зміна»</text>
  <text x="600" y="88" text-anchor="middle" class="subtitle">Основні сутності MVP, ключові атрибути та зв’язки між ними</text>

  <!-- User -->
  <g filter="url(#shadow)">
    <rect class="entity-accent" x="440" y="135" width="320" height="205" rx="20"/>
    <path class="entity-head-accent" d="M440 155 Q440 135 460 135 H740 Q760 135 760 155 V190 H440 Z"/>
  </g>
  <text x="600" y="172" text-anchor="middle" class="entity-title">Користувач</text>
  <line x1="440" y1="190" x2="760" y2="190" stroke="#13B981" stroke-width="1.5"/>
  <text x="468" y="223" class="field-key">PK  id</text>
  <text x="468" y="252" class="field">email</text>
  <text x="468" y="281" class="field">phone</text>
  <text x="468" y="310" class="field">role, isVerified</text>

  <!-- Worker profile -->
  <g filter="url(#shadow)">
    <rect class="entity" x="65" y="445" width="315" height="212" rx="20"/>
    <path class="entity-head" d="M65 465 Q65 445 85 445 H360 Q380 445 380 465 V500 H65 Z"/>
  </g>
  <text x="222" y="482" text-anchor="middle" class="entity-title">Профіль виконавця</text>
  <line x1="65" y1="500" x2="380" y2="500" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="92" y="533" class="field-key">PK  id</text>
  <text x="92" y="562" class="field-key">FK  userId</text>
  <text x="92" y="591" class="field">firstName, lastName</text>
  <text x="92" y="620" class="field">rating, description</text>

  <!-- Company -->
  <g filter="url(#shadow)">
    <rect class="entity" x="820" y="445" width="315" height="212" rx="20"/>
    <path class="entity-head" d="M820 465 Q820 445 840 445 H1115 Q1135 445 1135 465 V500 H820 Z"/>
  </g>
  <text x="977" y="482" text-anchor="middle" class="entity-title">Компанія</text>
  <line x1="820" y1="500" x2="1135" y2="500" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="847" y="533" class="field-key">PK  id</text>
  <text x="847" y="562" class="field-key">FK  ownerId</text>
  <text x="847" y="591" class="field">name, edrpou</text>
  <text x="847" y="620" class="field">legalAddress, description</text>

  <!-- Category -->
  <g filter="url(#shadow)">
    <rect class="entity-accent" x="65" y="755" width="270" height="155" rx="20"/>
    <path class="entity-head-accent" d="M65 775 Q65 755 85 755 H315 Q335 755 335 775 V810 H65 Z"/>
  </g>
  <text x="200" y="792" text-anchor="middle" class="entity-title">Категорія</text>
  <line x1="65" y1="810" x2="335" y2="810" stroke="#13B981" stroke-width="1.5"/>
  <text x="92" y="844" class="field-key">PK  id</text>
  <text x="92" y="874" class="field">name</text>

  <!-- Job position -->
  <g filter="url(#shadow)">
    <rect class="entity" x="455" y="735" width="290" height="183" rx="20"/>
    <path class="entity-head" d="M455 755 Q455 735 475 735 H725 Q745 735 745 755 V790 H455 Z"/>
  </g>
  <text x="600" y="772" text-anchor="middle" class="entity-title">Посада</text>
  <line x1="455" y1="790" x2="745" y2="790" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="482" y="823" class="field-key">PK  id</text>
  <text x="482" y="852" class="field-key">FK  categoryId</text>
  <text x="482" y="881" class="field">title</text>

  <!-- Location -->
  <g filter="url(#shadow)">
    <rect class="entity" x="820" y="735" width="315" height="218" rx="20"/>
    <path class="entity-head" d="M820 755 Q820 735 840 735 H1115 Q1135 735 1135 755 V790 H820 Z"/>
  </g>
  <text x="977" y="772" text-anchor="middle" class="entity-title">Робоча локація</text>
  <line x1="820" y1="790" x2="1135" y2="790" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="847" y="823" class="field-key">PK  id</text>
  <text x="847" y="852" class="field-key">FK  companyId</text>
  <text x="847" y="881" class="field">title, city, address</text>
  <text x="847" y="910" class="field">latitude, longitude</text>

  <!-- Shift -->
  <g filter="url(#shadow)">
    <rect class="entity-accent" x="420" y="1050" width="360" height="272" rx="22"/>
    <path class="entity-head-accent" d="M420 1072 Q420 1050 442 1050 H758 Q780 1050 780 1072 V1110 H420 Z"/>
  </g>
  <text x="600" y="1094" text-anchor="middle" class="entity-title">Зміна</text>
  <line x1="420" y1="1110" x2="780" y2="1110" stroke="#13B981" stroke-width="1.5"/>
  <text x="450" y="1143" class="field-key">PK  id</text>
  <text x="450" y="1172" class="field-key">FK  locationId</text>
  <text x="450" y="1201" class="field-key">FK  categoryId, positionId</text>
  <text x="450" y="1230" class="field">startTime, endTime</text>
  <text x="450" y="1259" class="field">hourlyRate, bonusRate</text>
  <text x="450" y="1288" class="field">status, description</text>

  <!-- Application -->
  <g filter="url(#shadow)">
    <rect class="entity" x="860" y="1080" width="275" height="220" rx="20"/>
    <path class="entity-head" d="M860 1100 Q860 1080 880 1080 H1115 Q1135 1080 1135 1100 V1135 H860 Z"/>
  </g>
  <text x="998" y="1117" text-anchor="middle" class="entity-title">Заявка на зміну</text>
  <line x1="860" y1="1135" x2="1135" y2="1135" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="885" y="1168" class="field-key">PK  id</text>
  <text x="885" y="1197" class="field-key">FK  shiftId, workerId</text>
  <text x="885" y="1226" class="field">status, appliedAt</text>
  <text x="885" y="1255" class="field">actualStartTime, actualEndTime</text>

  <!-- Review -->
  <g filter="url(#shadow)">
    <rect class="entity" x="420" y="1420" width="360" height="184" rx="20"/>
    <path class="entity-head" d="M420 1440 Q420 1420 440 1420 H760 Q780 1420 780 1440 V1475 H420 Z"/>
  </g>
  <text x="600" y="1457" text-anchor="middle" class="entity-title">Відгук</text>
  <line x1="420" y1="1475" x2="780" y2="1475" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="450" y="1508" class="field-key">PK  id</text>
  <text x="450" y="1537" class="field-key">FK  shiftId</text>
  <text x="450" y="1566" class="field-key">FK  reviewerId, revieweeId</text>
  <text x="450" y="1595" class="field">rating, comment</text>

  <!-- User / profile -->
  <path class="line" d="M520 340 V392 H222 V445"/>
  <text x="502" y="370" class="cardinality">1</text>
  <text x="239" y="425" class="cardinality">0..1</text>
  <text x="327" y="413" text-anchor="middle" class="rel">профіль</text>

  <!-- User / company -->
  <path class="line-accent" d="M680 340 V392 H977 V445"/>
  <text x="696" y="370" class="cardinality">1</text>
  <text x="993" y="425" class="cardinality">0..N</text>
  <text x="828" y="413" text-anchor="middle" class="rel">власник</text>

  <!-- Company / location -->
  <path class="line" d="M977 657 V735"/>
  <text x="954" y="685" class="cardinality">1</text>
  <text x="954" y="718" class="cardinality">0..N</text>
  <text x="1016" y="706" class="rel">локації</text>

  <!-- Category / position -->
  <path class="line-accent" d="M335 832 H455"/>
  <text x="354" y="820" class="cardinality">1</text>
  <text x="411" y="820" class="cardinality">0..N</text>
  <text x="395" y="860" text-anchor="middle" class="rel">посади</text>

  <!-- Category / shift -->
  <path class="line-secondary" d="M200 910 V990 H485 V1050"/>
  <text x="216" y="940" class="cardinality">1</text>
  <text x="500" y="1030" class="cardinality">0..N</text>
  <text x="345" y="980" text-anchor="middle" class="rel">категорія</text>

  <!-- Position / shift -->
  <path class="line" d="M600 918 V1050"/>
  <text x="619" y="951" class="cardinality">1</text>
  <text x="619" y="1032" class="cardinality">0..N</text>
  <text x="649" y="990" class="rel">посада</text>

  <!-- Location / shift -->
  <path class="line" d="M880 953 V1000 H748 V1050"/>
  <text x="897" y="981" class="cardinality">1</text>
  <text x="764" y="1031" class="cardinality">0..N</text>
  <text x="820" y="1022" text-anchor="middle" class="rel">зміни</text>

  <!-- User / application -->
  <path class="line-secondary" d="M760 270 H1165 V1197 H1135"/>
  <text x="772" y="255" class="cardinality">1</text>
  <text x="1140" y="1185" class="cardinality">0..N</text>
  <text x="1148" y="735" text-anchor="middle" class="rel" transform="rotate(-90 1148 735)">виконавець</text>

  <!-- Shift / application -->
  <path class="line-accent" d="M780 1183 H860"/>
  <text x="792" y="1160" class="cardinality">1</text>
  <text x="824" y="1160" class="cardinality">0..N</text>
  <text x="820" y="1225" text-anchor="middle" class="rel">заявки</text>

  <!-- Shift / review -->
  <path class="line" d="M600 1322 V1420"/>
  <text x="620" y="1354" class="cardinality">1</text>
  <text x="620" y="1402" class="cardinality">0..N</text>
  <text x="655" y="1382" class="rel">відгуки</text>

  <!-- User / review -->
  <path class="line-secondary" d="M440 270 H30 V1510 H420"/>
  <text x="42" y="290" class="cardinality">1</text>
  <text x="395" y="1497" class="cardinality">0..N</text>
  <text x="195" y="1545" text-anchor="middle" class="rel">автор або отримувач відгуку</text>

  <text x="600" y="1634" text-anchor="middle" class="note">PK — первинний ключ; FK — зовнішній ключ; 1, 0..1 та 0..N — кратність зв’язку.</text>
</svg>
