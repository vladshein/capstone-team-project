<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700" role="img" aria-labelledby="title description">
  <title id="title">Життєвий цикл зміни та заявки на зміну</title>
  <desc id="description">Вертикальна схема статусів зміни та заявки. Суцільні стрілки означають дії користувачів, пунктирні — автоматичні переходи lifecycle worker-а.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-18%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#182235" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#13B981"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#E11D48"/>
    </marker>
    <style>
      .title { font: 700 31px Arial, sans-serif; fill: #182235; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #64748B; }
      .legend { font: 600 15px Arial, sans-serif; fill: #475569; }
      .lane-title { font: 700 22px Arial, sans-serif; fill: #182235; }
      .lane-subtitle { font: 400 16px Arial, sans-serif; fill: #64748B; }
      .state-title { font: 700 20px Arial, sans-serif; fill: #182235; }
      .state-code { font: 600 15px Arial, sans-serif; fill: #0F766E; }
      .state-note { font: 400 15px Arial, sans-serif; fill: #64748B; }
      .callout { font: 400 16px Arial, sans-serif; fill: #475569; }
      .callout-strong { font: 700 16px Arial, sans-serif; fill: #182235; }
      .footer { font: 400 15px Arial, sans-serif; fill: #64748B; }
      .lane { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .state { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; }
      .state-active { fill: #ECFDF5; stroke: #13B981; stroke-width: 2; }
      .state-terminal { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 2; }
      .state-danger { fill: #FFF1F2; stroke: #FDA4AF; stroke-width: 2; }
      .callout-box { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.5; }
      .action { fill: none; stroke: #13B981; stroke-width: 3; marker-end: url(#arrow-green); }
      .automatic { fill: none; stroke: #64748B; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#arrow-gray); }
      .rejection { fill: none; stroke: #E11D48; stroke-width: 2.75; marker-end: url(#arrow-red); }
      .marker-green { fill: #13B981; }
      .marker-gray { fill: #64748B; }
      .marker-red { fill: #E11D48; }
      .marker-text { font: 700 14px Arial, sans-serif; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1200" height="1700" fill="#FFFFFF"/>
  <text x="600" y="58" text-anchor="middle" class="title">Життєвий цикл зміни та заявки на зміну</text>
  <text x="600" y="88" text-anchor="middle" class="subtitle">Статуси та реальні переходи, реалізовані в платформі «Зміна»</text>

  <line x1="305" y1="122" x2="355" y2="122" stroke="#13B981" stroke-width="3"/>
  <text x="370" y="128" class="legend">дія користувача</text>
  <line x1="610" y1="122" x2="660" y2="122" stroke="#64748B" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="675" y="128" class="legend">автоматична дія worker-а</text>

  <!-- Shift lane -->
  <rect class="lane" x="40" y="165" width="1120" height="565" rx="26"/>
  <text x="75" y="210" class="lane-title">Зміна (Shift)</text>
  <text x="75" y="237" class="lane-subtitle">Стани оголошення, яким керує компанія та lifecycle worker</text>

  <g filter="url(#shadow)">
    <rect class="state" x="70" y="315" width="205" height="106" rx="18"/>
  </g>
  <text x="172" y="358" text-anchor="middle" class="state-title">Створення</text>
  <text x="172" y="386" text-anchor="middle" class="state-note">компанією</text>

  <g filter="url(#shadow)">
    <rect class="state-active" x="335" y="315" width="205" height="106" rx="18"/>
  </g>
  <text x="437" y="357" text-anchor="middle" class="state-title">Відкрита зміна</text>
  <text x="437" y="386" text-anchor="middle" class="state-code">open</text>

  <g filter="url(#shadow)">
    <rect class="state-active" x="600" y="315" width="205" height="106" rx="18"/>
  </g>
  <text x="702" y="357" text-anchor="middle" class="state-title">Заброньована</text>
  <text x="702" y="386" text-anchor="middle" class="state-code">booked</text>

  <g filter="url(#shadow)">
    <rect class="state-terminal" x="865" y="315" width="225" height="106" rx="18"/>
  </g>
  <text x="977" y="357" text-anchor="middle" class="state-title">Завершена</text>
  <text x="977" y="386" text-anchor="middle" class="state-code">completed</text>

  <g filter="url(#shadow)">
    <rect class="state-danger" x="600" y="505" width="240" height="100" rx="18"/>
  </g>
  <text x="720" y="545" text-anchor="middle" class="state-title">Скасована</text>
  <text x="720" y="574" text-anchor="middle" class="state-code">cancelled</text>

  <path class="action" d="M275 368 H335"/>
  <path class="action" d="M540 368 H600"/>
  <path class="action" d="M805 368 H865"/>

  <path class="automatic" d="M702 315 V270 H977 V315"/>
  <path class="automatic" d="M437 421 V465 H680 V505"/>
  <path class="action" d="M702 421 V505"/>
  <circle cx="570" cy="368" r="14" class="marker-green"/>
  <text x="570" y="373" text-anchor="middle" class="marker-text">1</text>
  <circle cx="835" cy="368" r="14" class="marker-green"/>
  <text x="835" y="373" text-anchor="middle" class="marker-text">2</text>
  <circle cx="838" cy="270" r="14" class="marker-gray"/>
  <text x="838" y="275" text-anchor="middle" class="marker-text">3</text>
  <circle cx="572" cy="465" r="14" class="marker-gray"/>
  <text x="572" y="470" text-anchor="middle" class="marker-text">4</text>
  <circle cx="734" cy="465" r="14" class="marker-green"/>
  <text x="734" y="470" text-anchor="middle" class="marker-text">5</text>

  <rect class="callout-box" x="70" y="620" width="1020" height="90" rx="12"/>
  <text x="92" y="649" class="callout"><tspan class="callout-strong">1.</tspan> Компанія підтверджує одну заявку: зміна → booked.</text>
  <text x="590" y="649" class="callout"><tspan class="callout-strong">2.</tspan> Після endTime компанія підтверджує виконання.</text>
  <text x="92" y="680" class="callout"><tspan class="callout-strong">3.</tspan> Worker завершує booked-зміну через 12 годин після endTime.</text>
  <text x="630" y="680" class="callout"><tspan class="callout-strong">4.</tspan> Open-зміна після endTime → cancelled.</text>
  <text x="92" y="708" class="callout"><tspan class="callout-strong">5.</tspan> Компанія може скасувати open або booked-зміну до її початку.</text>

  <!-- Application lane -->
  <rect class="lane" x="40" y="770" width="1120" height="650" rx="26"/>
  <text x="75" y="815" class="lane-title">Заявка виконавця (ShiftApplication)</text>
  <text x="75" y="842" class="lane-subtitle">Зв’язує виконавця з конкретною зміною</text>

  <g filter="url(#shadow)">
    <rect class="state" x="70" y="930" width="205" height="106" rx="18"/>
  </g>
  <text x="172" y="970" text-anchor="middle" class="state-title">Подання заявки</text>
  <text x="172" y="998" text-anchor="middle" class="state-note">виконавцем</text>

  <g filter="url(#shadow)">
    <rect class="state-active" x="335" y="930" width="205" height="106" rx="18"/>
  </g>
  <text x="437" y="971" text-anchor="middle" class="state-title">На розгляді</text>
  <text x="437" y="999" text-anchor="middle" class="state-code">pending</text>

  <g filter="url(#shadow)">
    <rect class="state-active" x="600" y="930" width="205" height="106" rx="18"/>
  </g>
  <text x="702" y="971" text-anchor="middle" class="state-title">Підтверджена</text>
  <text x="702" y="999" text-anchor="middle" class="state-code">approved</text>

  <g filter="url(#shadow)">
    <rect class="state-terminal" x="865" y="930" width="225" height="106" rx="18"/>
  </g>
  <text x="977" y="971" text-anchor="middle" class="state-title">Виконана</text>
  <text x="977" y="999" text-anchor="middle" class="state-code">completed</text>

  <g filter="url(#shadow)">
    <rect class="state-danger" x="335" y="1130" width="205" height="94" rx="18"/>
  </g>
  <text x="437" y="1167" text-anchor="middle" class="state-title">Відкликано</text>
  <text x="437" y="1193" text-anchor="middle" class="state-note">запис видалено</text>

  <g filter="url(#shadow)">
    <rect class="state-danger" x="600" y="1130" width="205" height="94" rx="18"/>
  </g>
  <text x="702" y="1167" text-anchor="middle" class="state-title">Відхилена</text>
  <text x="702" y="1193" text-anchor="middle" class="state-code">rejected</text>

  <g filter="url(#shadow)">
    <rect class="state-terminal" x="865" y="1130" width="225" height="94" rx="18"/>
  </g>
  <text x="977" y="1167" text-anchor="middle" class="state-title">Не з’явився</text>
  <text x="977" y="1193" text-anchor="middle" class="state-code">no_show</text>

  <path class="action" d="M275 983 H335"/>
  <path class="action" d="M540 983 H600"/>
  <path class="action" d="M805 983 H865"/>
  <path class="automatic" d="M702 930 V885 H977 V930"/>
  <path class="action" d="M390 1036 V1130"/>
  <path class="rejection" d="M485 1036 V1080 H660 V1130"/>
  <path class="rejection" d="M660 1036 V1130"/>
  <path class="action" d="M745 1036 V1080 H977 V1130"/>
  <circle cx="570" cy="983" r="14" class="marker-green"/>
  <text x="570" y="988" text-anchor="middle" class="marker-text">1</text>
  <circle cx="835" cy="983" r="14" class="marker-green"/>
  <text x="835" y="988" text-anchor="middle" class="marker-text">2</text>
  <circle cx="838" cy="885" r="14" class="marker-gray"/>
  <text x="838" y="890" text-anchor="middle" class="marker-text">3</text>
  <circle cx="390" cy="1080" r="14" class="marker-green"/>
  <text x="390" y="1085" text-anchor="middle" class="marker-text">4</text>
  <circle cx="563" cy="1080" r="14" class="marker-red"/>
  <text x="563" y="1085" text-anchor="middle" class="marker-text">5</text>
  <circle cx="660" cy="1080" r="14" class="marker-red"/>
  <text x="660" y="1085" text-anchor="middle" class="marker-text">6</text>
  <circle cx="850" cy="1080" r="14" class="marker-green"/>
  <text x="850" y="1085" text-anchor="middle" class="marker-text">7</text>

  <rect class="callout-box" x="70" y="1250" width="1020" height="150" rx="12"/>
  <text x="92" y="1280" class="callout"><tspan class="callout-strong">1.</tspan> Компанія підтверджує pending-заявку; усі інші pending-заявки цієї зміни → rejected.</text>
  <text x="92" y="1308" class="callout"><tspan class="callout-strong">2.</tspan> Компанія після endTime підтверджує виконання. <tspan class="callout-strong">3.</tspan> Worker виконує цей перехід через 12 годин.</text>
  <text x="92" y="1336" class="callout"><tspan class="callout-strong">4.</tspan> Виконавець відкликає pending-заявку до початку зміни; запис фізично видаляється.</text>
  <text x="92" y="1364" class="callout"><tspan class="callout-strong">5.</tspan> Pending → rejected: відмова компанії, початок зміни або скасування зміни.</text>
  <text x="92" y="1392" class="callout"><tspan class="callout-strong">6.</tspan> Approved → rejected: скасовано booked-зміну до початку. <tspan class="callout-strong">7.</tspan> No-show — позначка компанії після endTime.</text>

  <rect class="callout-box" x="70" y="1450" width="1020" height="112" rx="14"/>
  <text x="600" y="1484" text-anchor="middle" class="callout">Після Shift = completed та Application = completed або no_show сторони можуть залишити взаємний відгук.</text>
  <text x="600" y="1518" text-anchor="middle" class="footer">Worker запускає перевірку життєвого циклу з інтервалом до 5 хвилин.</text>
  <text x="600" y="1546" text-anchor="middle" class="footer">Статус in_progress передбачений моделлю, але окремий автоматичний чи API-перехід до нього поки не реалізований.</text>

  <text x="600" y="1630" text-anchor="middle" class="footer">Суцільні стрілки показують дії компанії або виконавця; пунктирні — фонову обробку worker-процесом.</text>
</svg>
